# Scheduler only. Port zero disables its health listener in v2.22.4.
host: 127.0.0.1
check_updates: false
auth:
  mode: none
default_execution_mode: local
scheduler:
  port: 0
coordinator:
  enabled: false
queues:
  enabled: true
  config:
    - name: proof-serial
      max_concurrency: 1
env_passthrough:
  - OCQ_PROOF_RUN
